name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: checks
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        run: cargo tauri build --ci

      - name: List Linux bundles
        if: runner.os == 'Linux'
        run: find src-tauri/target/release/bundle -type f | sort

      - name: List Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            ForEach-Object { $_.FullName }

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tunnelink-${{ runner.os }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: tunnelink-*
          merge-multiple: true

      - name: Collect release assets
        id: release-assets
        shell: bash
        run: |
          find . -type f | sort

          mapfile -t assets < <(find . -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.rpm' \
          \) | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer assets were downloaded from bundle artifacts." >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.release-assets.outputs.files }}
